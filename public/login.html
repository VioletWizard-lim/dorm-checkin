<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<title>기숙사 외출체크 - 로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-column">

    <div class="login-brand">
      <div class="login-brand__logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 21V9L12 3L20 9V21H14V14H10V21H4Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="login-brand__title">기숙사 외출체크</div>
      <div class="login-brand__subtitle">교사 계정으로 로그인해 주세요</div>
    </div>

    <form class="login-card" id="loginForm" novalidate onsubmit="return false">

      <div class="field">
        <label for="userId">아이디</label>
        <input id="userId" name="userId" type="text" placeholder="아이디 입력" autocomplete="username" autocapitalize="off" spellcheck="false">
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>

      <div id="errorBox" class="alert alert-error" hidden></div>
      <div id="noticeBox" class="alert alert-notice" hidden></div>

      <button type="submit" id="submitBtn" class="btn-primary">로그인</button>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe">
        이 기기에서 아이디 저장
      </label>

    </form>

    <div class="login-footer">계정이 없으신가요? 관리자(기숙사팀)에게 발급을 요청해 주세요.</div>

  </div>
</div>

<script type="module" src="./js/login.js"></script>
</body>
</html>
