<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<link rel="icon" href="./img/icon.svg" type="image/svg+xml">
<link rel="icon" href="./img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C2230">
<title>기숙사 면학 시스템 - 로그인</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="login-page">
  <div class="login-column">

    <div class="login-brand">
      <img class="login-brand__icon" src="./img/icon.svg" width="64" height="64" alt="">
      <div class="login-brand__title">기숙사 면학 시스템</div>
      <div class="login-brand__subtitle" id="loginSubtitle">교사 계정으로 로그인해 주세요</div>
    </div>

    <form class="login-card" id="loginForm" novalidate onsubmit="return false">

      <div class="login-tabs" role="tablist" aria-label="로그인 종류">
        <button type="button" class="login-tab is-active" role="tab" aria-selected="true" data-login-mode="staff">교사</button>
        <button type="button" class="login-tab" role="tab" aria-selected="false" data-login-mode="student">학생</button>
      </div>

      <div class="field">
        <label for="userId" id="userIdLabel">아이디</label>
        <input id="userId" name="userId" type="text" placeholder="아이디 입력" autocomplete="username" autocapitalize="off" spellcheck="false">
      </div>

      <div class="field">
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" placeholder="비밀번호 입력" autocomplete="current-password">
      </div>

      <div id="errorBox" class="alert alert-error" hidden></div>
      <div id="noticeBox" class="alert alert-notice" hidden></div>

      <button type="submit" id="submitBtn" class="btn-primary">로그인</button>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe">
        이 기기에서 아이디 저장
      </label>

    </form>

    <div class="login-footer" id="loginFooter">계정이 없으신가요? 관리자(임재성)에게 발급을 요청해 주세요.</div>

  </div>
</div>

<script type="module" src="./js/login.js"></script>
</body>
</html>
