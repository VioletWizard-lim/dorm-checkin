<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<link rel="icon" href="./img/icon.svg" type="image/svg+xml">
<link rel="icon" href="./img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C2230">
<title>기숙사 면학 시스템 - 현황판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="check-page">

  <!-- 공통 메뉴(js/nav.js가 채움): 모든 화면에서 같은 순서, 지금 화면은 강조 -->
  <nav class="app-nav" id="appNav" aria-label="메뉴">
    <span class="loading-hint" id="navLoadingHint">메뉴 확인 중...</span>
  </nav>

  <header class="check-header">
    <div class="check-header__titles">
      <div class="check-header__title">기숙사 현황판</div>
      <div class="check-header__subtitle">외출·방과후 실시간 현황</div>
    </div>
    <div class="check-header__meta">
      <div class="check-header__date" id="todayDate"></div>
      <div class="current-user" id="currentUserBox">
        <span class="current-user__name" id="currentUserName"></span>
        <span class="role-badge" id="currentUserRoleBadge"></span>
      </div>
      <button type="button" class="back-link" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="check-toolbar">
    <div class="filter-group">
      <span class="filter-group__label">학년</span>
      <div class="filter-chips" id="gradeChips"></div>
    </div>
    <div class="check-toolbar__divider"></div>
    <div class="filter-group">
      <span class="filter-group__label">실</span>
      <div class="filter-chips" id="filterChips"></div>
    </div>
  </div>

  <div class="display-board">
    <section class="display-panel display-panel--away">
      <div class="display-panel__header">
        <span class="display-panel__title">자리 없음</span>
        <span class="display-panel__count" id="awayPanelCount">0명</span>
      </div>
      <div class="display-panel__list" id="awayPanelList"></div>
    </section>
    <section class="display-panel display-panel--out">
      <div class="display-panel__header">
        <span class="display-panel__title">외출중</span>
        <span class="display-panel__count" id="outPanelCount">0명</span>
      </div>
      <div class="display-panel__list" id="outPanelList"></div>
    </section>
    <section class="display-panel display-panel--leave">
      <div class="display-panel__header">
        <span class="display-panel__title">명령퇴사</span>
        <span class="display-panel__count" id="leavePanelCount">0명</span>
      </div>
      <div class="display-panel__list" id="leavePanelList"></div>
    </section>
    <section class="display-panel display-panel--afterschool">
      <div class="display-panel__header">
        <span class="display-panel__title">오늘 방과후</span>
        <span class="display-panel__count" id="afterschoolPanelCount">0명</span>
      </div>
      <div class="display-panel__list" id="afterschoolPanelList"></div>
    </section>
  </div>

</div>

<script type="module" src="./js/display.js"></script>
</body>
</html>
