<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<link rel="icon" href="./img/icon.svg" type="image/svg+xml">
<link rel="icon" href="./img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C2230">
<title>기숙사 면학 시스템 - 좌석 배치판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="check-page">

  <header class="check-header">
    <div class="check-header__titles">
      <div class="check-header__title">좌석 배치판</div>
      <div class="check-header__subtitle">실별 좌석 배치 보기·편집</div>
    </div>
    <div class="check-header__meta">
      <a href="./check.html" class="back-link">← 체크 화면으로</a>
      <a href="./display.html" class="back-link">현황판 보기</a>
      <span class="loading-hint" id="navLoadingHint">메뉴 확인 중...</span>
      <a href="./students.html" class="back-link" id="manageLink" hidden>학생 명단 관리</a>
      <a href="./history.html" class="back-link" id="historyLink" hidden>외출 기록</a>
      <a href="./afterschool.html" class="back-link" id="afterschoolLink" hidden>방과후 일정</a>
      <a href="./accounts.html" class="back-link" id="accountsLink" hidden>계정 관리</a>
      <div class="check-header__date" id="todayDate"></div>
      <div class="current-user" id="currentUserBox">
        <span class="current-user__name" id="currentUserName"></span>
        <span class="role-badge" id="currentUserRoleBadge"></span>
      </div>
      <button type="button" class="back-link" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="check-toolbar">
    <div class="filter-chips" id="roomTabs"></div>
    <span class="loading-hint" id="editControlsLoadingHint">권한 확인 중...</span>
    <button type="button" class="btn-add" id="addRoomBtn" hidden>+ 실 추가</button>
    <div class="roster-toolbar__actions ml-auto">
      <button type="button" class="btn-secondary" id="seatBulkBtn" hidden>좌석 일괄 등록</button>
      <button type="button" class="btn-secondary" id="editModeToggle" hidden>편집 모드</button>
    </div>
  </div>

  <div class="roster-form-wrap room-settings-panel" id="roomSettingsPanel" hidden>
    <div class="roster-form">
      <div class="roster-form__row">
        <div class="field">
          <label for="roomNameInput">실 이름</label>
          <input id="roomNameInput" type="text" placeholder="예: 1·2학년실" autocomplete="off">
        </div>
        <div class="field">
          <label>대상 학년</label>
          <div class="grade-toggle-row" id="roomGradeToggleRow"></div>
        </div>
        <div class="field">
          <label>행 (rows)</label>
          <div class="stepper">
            <button type="button" class="stepper__btn" id="rowsMinusBtn">−</button>
            <span class="stepper__value" id="rowsValue">0</span>
            <button type="button" class="stepper__btn" id="rowsPlusBtn">+</button>
          </div>
        </div>
        <div class="field">
          <label>열 (cols)</label>
          <div class="stepper">
            <button type="button" class="stepper__btn" id="colsMinusBtn">−</button>
            <span class="stepper__value" id="colsValue">0</span>
            <button type="button" class="stepper__btn" id="colsPlusBtn">+</button>
          </div>
        </div>
      </div>
      <div class="roster-form__actions">
        <button type="button" class="btn-danger" id="deleteRoomBtn">이 실 삭제</button>
      </div>
    </div>
  </div>

  <!-- 좌석 일괄 등록(편집 모드, 이 실을 편집할 수 있을 때): 엑셀에 자리 모양대로 적은 학번표를 붙여넣는다 -->
  <div class="roster-form-wrap" id="seatBulkWrap" hidden>
    <div class="roster-form">
      <div class="field">
        <label for="seatBulkInput">좌석 일괄 등록 — <span id="seatBulkRoomName"></span></label>
        <span class="field-hint">엑셀에 좌석 모양대로 학번을 적고 그 칸들을 복사해 붙여넣으면 같은 모양으로 배정됩니다(빈 칸 = 빈자리, 칸에 "10305 홍길동"처럼 이름이 같이 있어도 됨). 학번만 한 줄에 하나씩 붙여넣으면 앞자리부터(왼쪽→오른쪽, 위→아래) 차례로 채웁니다. 저장하면 이 실의 지금 좌석표는 새 좌석표로 바뀝니다.</span>
        <textarea id="seatBulkInput" rows="6" placeholder="10301	10302	10303
10304		10306"></textarea>
      </div>
      <div class="bulk-preview" id="seatBulkPreview"></div>
      <div class="roster-form__actions">
        <button type="button" class="btn-secondary" id="seatBulkCancelBtn">취소</button>
        <button type="button" class="btn-add" id="seatBulkSaveBtn" disabled>좌석표 저장 (0명)</button>
      </div>
    </div>
  </div>

  <div class="seat-legend">
    <span class="seat-legend__item"><span class="seat-legend__swatch seat-legend__swatch--away"></span>자리 없음</span>
    <span class="seat-legend__item"><span class="seat-legend__swatch seat-legend__swatch--out"></span>외출중</span>
    <span class="seat-legend__item"><span class="seat-legend__swatch seat-legend__swatch--leave"></span>명령퇴사</span>
    <span class="seat-legend__item"><span class="seat-legend__swatch seat-legend__swatch--afterschool"></span>오늘 방과후</span>
    <span class="seat-legend__item"><span class="seat-legend__swatch seat-legend__swatch--in"></span>재실</span>
    <span class="seat-legend__item"><span class="seat-legend__swatch seat-legend__swatch--empty"></span>빈자리</span>
  </div>

  <div class="seat-board">
    <div class="seat-grid" id="seatGrid"></div>
  </div>

</div>

<script type="module" src="./js/seat.js"></script>
</body>
</html>
