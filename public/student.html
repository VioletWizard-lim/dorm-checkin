<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<link rel="icon" href="./img/icon.svg" type="image/svg+xml">
<link rel="icon" href="./img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#1C2230">
<title>기숙사 면학 시스템 - 학생</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="student-page">

  <header class="student-header">
    <div>
      <div class="student-header__name" id="studentName"></div>
      <div class="student-header__meta" id="studentMeta">불러오는 중...</div>
    </div>
    <button type="button" class="back-link" id="logoutBtn">로그아웃</button>
  </header>

  <section class="student-section">
    <div class="student-section__title">오늘 내 상태 <span class="since-text" id="todayDate"></span></div>
    <div class="my-status" id="statusBox"><span class="student-empty">불러오는 중...</span></div>
  </section>

  <!-- 승인된 외출이 있을 때만: 확인하는 선생님께 보여 주는 외출증(문자 대신 화면으로) -->
  <section class="student-section" id="passSection" hidden>
    <div class="student-section__title">외출증 <span class="pass-clock" id="passClock"></span></div>
    <canvas class="pass-canvas" id="passCanvas" role="img" aria-label="외출증"></canvas>
    <div class="field-hint">확인하는 선생님께 이 화면을 그대로 보여 주세요. 위의 시계가 움직이지 않으면 캡처한 화면입니다.</div>
  </section>

  <section class="student-section">
    <div class="student-section__title">외출 신청</div>
    <form class="student-form" id="requestForm" novalidate>
      <div class="field">
        <label for="reasonInput">외출 사유</label>
        <input id="reasonInput" type="text" maxlength="200" placeholder="예: 병원 진료" autocomplete="off">
      </div>
      <div class="field">
        <label for="startHour">외출 시각</label>
        <div class="time-select">
          <select id="startHour" aria-label="외출 시"></select>
          <select id="startMinute" aria-label="외출 분"></select>
        </div>
      </div>
      <div class="field">
        <label for="returnHour">예상 복귀 시각</label>
        <div class="time-select">
          <select id="returnHour" aria-label="복귀 시"></select>
          <select id="returnMinute" aria-label="복귀 분"></select>
        </div>
        <span class="field-hint">이 시각이 지나면 자동으로 복귀 처리돼요.</span>
      </div>
      <button type="submit" class="btn-primary" id="requestBtn" disabled>외출 신청</button>
      <div class="field-hint" id="requestHint"></div>
    </form>
  </section>

  <section class="student-section">
    <div class="student-section__title">오늘 신청 내역</div>
    <div class="student-form" id="requestList"><span class="student-empty">불러오는 중...</span></div>
  </section>

</div>

<script type="module" src="./js/student.js"></script>
</body>
</html>
