<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<title>기숙사 외출체크 - 학생 명단 관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="check-page">

  <header class="check-header">
    <div class="check-header__titles">
      <div class="check-header__title">학생 명단 관리</div>
      <div class="check-header__subtitle">학년별 명단과 방과후 요일을 등록·수정합니다</div>
    </div>
    <div class="check-header__meta">
      <a href="./check.html" class="back-link">← 체크 화면으로</a>
      <div class="current-user" id="currentUserBox">
        <span class="current-user__name" id="currentUserName"></span>
        <span class="role-badge" id="currentUserRoleBadge"></span>
      </div>
      <button type="button" class="back-link" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="roster-toolbar">
    <div class="filter-chips" id="gradeTabs"><span class="loading-hint">불러오는 중...</span></div>
    <div class="roster-toolbar__actions">
      <button type="button" class="btn-secondary" id="bulkAddBtn" disabled>여러 명 한번에 추가</button>
      <button type="button" class="btn-add" id="addStudentBtn" disabled>+ 학생 추가</button>
    </div>
  </div>

  <div class="roster-form-wrap" id="formWrap" hidden>
    <form class="roster-form" id="studentForm">
      <input type="hidden" id="editingId" value="">
      <div class="roster-form__row">
        <div class="field">
          <label for="inputName">이름</label>
          <input id="inputName" type="text" placeholder="예: 홍길동" autocomplete="off">
        </div>
        <div class="field">
          <label for="inputSid">학번</label>
          <input id="inputSid" type="text" placeholder="예: 10305" autocomplete="off">
        </div>
        <div class="field">
          <label for="inputCls">반</label>
          <input id="inputCls" type="text" placeholder="예: 1학년 3반" autocomplete="off">
          <span class="field-hint">학번 입력 시 자동으로 채워집니다. 필요하면 직접 수정하세요.</span>
        </div>
      </div>
      <div class="field">
        <label for="inputEmail">이메일 (선택)</label>
        <input id="inputEmail" type="email" placeholder="예: student@example.com" autocomplete="off">
        <span class="field-hint">입력해두면 외출 체크 시 외출증 이메일이 자동으로 발송됩니다.</span>
      </div>
      <div class="field">
        <label>방과후 요일</label>
        <div class="day-toggle-row" id="dayToggleRow"></div>
      </div>
      <div class="roster-form__row">
        <div class="field">
          <label for="inputLeaveFrom">명령퇴사 시작일 (선택)</label>
          <input id="inputLeaveFrom" type="date">
        </div>
        <div class="field">
          <label for="inputLeaveTo">명령퇴사 종료일 (선택)</label>
          <input id="inputLeaveTo" type="date">
        </div>
        <div class="field">
          <label for="inputLeaveReason">사유 (선택)</label>
          <input id="inputLeaveReason" type="text" placeholder="예: 장기 결석" autocomplete="off">
          <span class="field-hint">기간을 지정하면 그 기간 동안 현황판에 "명령퇴사"로 표시되고, 무단외출·자리비움 판정에서 제외됩니다.</span>
        </div>
      </div>
      <div class="roster-form__actions">
        <button type="button" class="btn-secondary" id="cancelFormBtn">취소</button>
        <button type="submit" class="btn-add" id="submitFormBtn">저장</button>
      </div>
    </form>
  </div>

  <div class="roster-form-wrap" id="bulkFormWrap" hidden>
    <div class="roster-form">
      <div class="field">
        <label for="bulkInput">여러 명 붙여넣기</label>
        <span class="field-hint">한 줄에 한 명씩 "이름 학번" 또는 "이름 학번 이메일" 형식입니다. 엑셀에서 해당 열들을 선택해 그대로 복사·붙여넣기 하면 됩니다. 반은 학번으로 자동 계산됩니다.</span>
        <textarea id="bulkInput" rows="8" placeholder="홍길동	10305	student1@example.com
김민준	10312"></textarea>
      </div>
      <div class="bulk-preview" id="bulkPreview"></div>
      <div class="roster-form__actions">
        <button type="button" class="btn-secondary" id="cancelBulkFormBtn">취소</button>
        <button type="button" class="btn-add" id="bulkSaveBtn" disabled>일괄 저장 (0명)</button>
      </div>
    </div>
  </div>

  <div class="student-list" id="rosterList"><div class="student-list__empty">불러오는 중...</div></div>

</div>

<script type="module" src="./js/students.js"></script>
</body>
</html>
