<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="PskTvPUma23TKR9FEzgMFdyuOPyNKl2Cs_kTToIcHhw" />
<title>기숙사 외출체크 - 체크 입력</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="check-page">

  <header class="check-header">
    <div class="check-header__titles">
      <div class="check-header__title">기숙사 외출 체크</div>
      <div class="check-header__subtitle">사감·당직 교사용 입력 화면</div>
    </div>
    <div class="check-header__meta">
      <a href="./display.html" class="back-link" id="displayLink">현황판 보기</a>
      <a href="./seat.html" class="back-link" id="seatLink">좌석 배치판 보기</a>
      <span class="loading-hint" id="navLoadingHint">메뉴 확인 중...</span>
      <a href="./students.html" class="back-link" id="manageLink" hidden>학생 명단 관리</a>
      <a href="./history.html" class="back-link" id="historyLink" hidden>외출 기록</a>
      <a href="./accounts.html" class="back-link" id="accountsLink" hidden>계정 관리</a>
      <div class="check-header__date" id="todayDate"></div>
      <div class="out-count-badge">
        <span class="out-count-badge__dot"></span>
        <span id="outCountText">외출중 0명</span>
      </div>
      <div class="current-user" id="currentUserBox">
        <span class="current-user__name" id="currentUserName"></span>
        <span class="role-badge" id="currentUserRoleBadge"></span>
      </div>
      <button type="button" class="back-link" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <section class="request-panel" id="requestPanel" hidden>
    <div class="request-panel__header">
      <span class="request-panel__title">외출 신청 대기</span>
      <span class="request-panel__count" id="requestCount">0건</span>
      <span class="since-text">승인하면 바로 외출중으로 바뀝니다</span>
    </div>
    <div class="request-panel__list" id="requestList"></div>
  </section>

  <div class="check-toolbar">
    <label for="search" class="sr-only">학생 이름 검색</label>
    <div class="check-toolbar__search">
      <input id="search" type="text" placeholder="학생 이름 검색" autocomplete="off">
    </div>
    <div class="check-toolbar__divider"></div>
    <div class="date-picker-group">
      <label for="dateSelect" class="field-hint">조회 날짜</label>
      <input type="date" id="dateSelect" class="date-input">
    </div>
    <div class="check-toolbar__divider"></div>
    <div class="filter-chips" id="filterChips"></div>
  </div>

  <div class="alert alert-notice past-date-notice" id="pastDateNotice" hidden>
    지난 기록을 보는 중입니다 — 지난 날짜의 외출 기록은 보기만 할 수 있습니다.
  </div>

  <div class="student-list" id="studentList"></div>

</div>

<script type="module" src="./js/check.js"></script>
</body>
</html>
