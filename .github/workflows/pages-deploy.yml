# 화면 파일(public/)을 GitHub Pages에 올린다. main에 public/이 바뀐 채로 들어오면 자동 배포.
# 저장소 Settings → Pages → Source가 "GitHub Actions"여야 한다(한 번만 설정).
# 주소: https://violetwizard-lim.github.io/dorm-checkin/
name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
