# 예전 주소(https://dorm-checkin-647d6.web.app)를 새 주소(GitHub Pages)로 넘겨 주는 페이지를 올린다.
# 화면 호스팅을 GitHub Pages로 옮긴 뒤 한 번만 수동으로 실행(Actions → 이 워크플로 → Run workflow).
# 시크릿 FIREBASE_SERVICE_ACCOUNT_DORM_CHECKIN_647D6가 필요하다. 다 옮긴 뒤 Firebase 프로젝트를 지울 거면 실행하지 않아도 됨.
name: Firebase old URL → GitHub Pages redirect (manual)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DORM_CHECKIN_647D6 }}
          channelId: live
          projectId: dorm-checkin-647d6
          entryPoint: firebase-redirect
