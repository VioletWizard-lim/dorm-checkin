name: Deploy Supabase (DB migrations + Edge Functions)
on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - "tests/db/**"
      - ".github/workflows/supabase-deploy.yml"
      - ".github/workflows/supabase-test.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$ACCESS_TOKEN" ] && [ -n "$PROJECT_REF" ] && [ -n "$DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase 시크릿(SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD)이 아직 없어서 배포를 건너뜁니다."
          fi

  test:
    uses: ./.github/workflows/supabase-test.yml

  deploy:
    needs: [config, test]
    if: needs.config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      # CLI 버전 고정: latest가 3.x로 올라가며 db push가 기본으로 로컬 DB를 가리키게 바뀌어 배포가 실패했음.
      # 올릴 때는 아래 명령의 옵션이 그대로인지 확인할 것(3.x: 원격은 --remote, 확인 질문은 --yes)
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes
      - run: supabase functions deploy --use-api --yes
