name: Supabase tests
on:
  pull_request:
    paths:
      - "supabase/**"
      - "tests/db/**"
      - "scripts/migrate/**"
      - ".github/workflows/supabase-test.yml"
  workflow_call:

permissions:
  contents: read

jobs:
  db:
    name: RLS·RPC (local Postgres)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/db/run.sh
      - name: 새 테이블 자동 노출을 끈 프로젝트 설정에서도 같은지
        run: NO_DEFAULT_GRANTS=1 bash tests/db/run.sh

  functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --node-modules-dir=none --no-lock --allow-env supabase/functions/
      - run: deno check --node-modules-dir=none --no-lock supabase/functions/*/index.ts

  migrate-script:
    name: Migration script
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/migrate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/migrate/package-lock.json
      - run: npm ci
      - run: npm test
